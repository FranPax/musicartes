  var norm = function(s){
    return (s||'').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  };

  // pre-cálculo de campos normalizados
  DATA.forEach(function(x){ x._n = norm(x.n); x._d = norm(x.d); x._c = x.c; });

  var input   = document.getElementById('cpgt-input');
  var results = document.getElementById('cpgt-results');
  var clearBt = document.getElementById('cpgt-clear');
  var chips   = document.getElementById('cpgt-chips');

  function score(item, q){
    var n = item._n, d = item._d;
    if (item._c === q) return 100;
    if (n === q) return 95;
    if (n.indexOf(q) === 0) return 80;
    if (n.indexOf(' '+q) > -1) return 70;
    if (n.indexOf(q) > -1) return 55;
    if (d.indexOf(q) > -1) return 40;
    if (item._c.indexOf(q) > -1) return 35;
    return 0;
  }

  function search(raw){
    var q = norm(raw);
    if (!q) return [];
    var out = [];
    for (var i=0;i<DATA.length;i++){
      var s = score(DATA[i], q);
      if (s>0) out.push({s:s, it:DATA[i]});
    }
    out.sort(function(a,b){ return b.s - a.s || a.it._n.localeCompare(b.it._n); });
    return out.slice(0,40).map(function(o){return o.it;});
  }

  function highlight(text, q){
    if(!q) return text;
    var nq = norm(q);
    var nt = norm(text);
    var idx = nt.indexOf(nq);
    if(idx<0) return text;
    return text.slice(0,idx)+'<mark>'+text.slice(idx,idx+nq.length)+'</mark>'+text.slice(idx+nq.length);
  }

  function render(list, raw){
    if(!raw){ results.innerHTML=''; return; }
    if(!list.length){
      results.innerHTML = '<div class="cpgt-empty">No encontramos "<strong>'+
        raw.replace(/</g,'&lt;')+'</strong>". Probá con el nombre del municipio o la zona.</div>';
      return;
    }
    var html = '';
    list.forEach(function(it){
      html += '<div class="cpgt-card">'+
                '<div class="cpgt-cinfo">'+
                  '<span class="cpgt-name">'+highlight(it.n, raw)+'</span>'+
                  '<span class="cpgt-depto">'+it.d+'</span>'+
                '</div>'+
                '<button class="cpgt-code" data-code="'+it.c+'" title="Copiar código">'+
                  '<span>'+it.c+'</span>'+
                  '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 1H4a2 2 0 0 0-2 2v12h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>'+
                '</button>'+
              '</div>';
    });
    results.innerHTML = html;
  }

  var t;
  function onType(){
    var v = input.value;
    clearBt.hidden = !v;
    chips.style.display = v ? 'none' : '';
    clearTimeout(t);
    t = setTimeout(function(){ render(search(v), v); }, 90);
  }

  input.addEventListener('input', onType);

  clearBt.addEventListener('click', function(){
    input.value=''; clearBt.hidden=true; chips.style.display='';
    results.innerHTML=''; input.focus();
  });

  chips.addEventListener('click', function(e){
    var c = e.target.closest('.cpgt-chip');
    if(!c) return;
    input.value = c.getAttribute('data-q');
    onType(); input.focus();
  });

  results.addEventListener('click', function(e){
    var b = e.target.closest('.cpgt-code');
    if(!b) return;
    var code = b.getAttribute('data-code');
    var done = function(){
      b.classList.add('cpgt-copied');
      var sp = b.querySelector('span'); var old = sp.textContent;
      sp.textContent = 'Copiado';
      setTimeout(function(){ sp.textContent = old; b.classList.remove('cpgt-copied'); }, 1100);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(code).then(done).catch(done);
    } else {
      var ta=document.createElement('textarea'); ta.value=code; document.body.appendChild(ta);
      ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); done();
    }
  });
})();
</script>
